version: "3"

services:
  nginx:
    container_name: fastapi_sso_nginx
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/nginx:1.25.3
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./logs/nginx:/var/log/nginx
      - ./nginx/certs/cert.pem:/etc/nginx/cert.pem  # 替换为实际证书路径
      - ./nginx/certs/cert.key:/etc/nginx/key.pem    # 替换为实际私钥路径
    ports:
      - 80:80
      - 81:81
      - 8081:8081
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      frontend2:
        condition: service_healthy
      backend:
        condition: service_healthy
      backend2:
        condition: service_healthy
      casdoor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    container_name: fastapi_sso_backend
    build:
      context: backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PYTHONPATH: .
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_USER}
    volumes:
      - ./logs/backend:/logs
    ports:
      - 8888:8888
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      casdoor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/api"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  backend2:
    container_name: fastapi_sso_backend2
    build:
      context: backend2
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PYTHONPATH: .
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_USER}
    volumes:
      - ./logs/backend2:/logs
    ports:
      - 8889:8889
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      casdoor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8889/api2"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    container_name: fastapi_sso_frontend
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - 8000:8000
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend2:
    container_name: fastapi_sso_frontend2
    build:
      context: frontend2
      dockerfile: Dockerfile
    ports:
      - 8001:8001
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    container_name: fastapi_sso_postgres
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  casdoor:
    container_name: fastapi_sso_casdoor
    image: casbin/casdoor:latest
    environment:
      RUNNING_IN_DOCKER: "true"
    ports:
      - 8002:8000
    depends_on:
      casdoor_postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./casdoor/conf:/conf
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  casdoor_postgres:
    container_name: fastapi_sso_casdoor_postgres
    image: postgres:latest
    environment:
      POSTGRES_DB: casdoor
      POSTGRES_USER: casdoor
      POSTGRES_PASSWORD: casdoor_password
    volumes:
      - casdoor_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casdoor"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  casdoor_postgres_data:
